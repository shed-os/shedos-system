# Networking modules used by /etc/sysctl.d/99-shedos-tuning.conf.
#
# tcp_bbr provides the BBR congestion control algorithm
# (net.ipv4.tcp_congestion_control=bbr); sch_cake is the CAKE qdisc
# (net.core.default_qdisc=cake). Both Arch's stock `linux` kernel and
# our `shedos-kernel` build them as modules; without an explicit
# load here, systemd-sysctl would silently fail on first boot
# because the modules aren't loaded yet when sysctl runs.
#
# Loaded by systemd-modules-load.service before systemd-sysctl.

tcp_bbr
sch_cake
