# Companion to /etc/systemd/system.conf.d/shedos-quiet-status.conf —
# user-level systemd has its own ShowStatus= setting, separate from
# system-level. Without this, user-systemd prints "[ OK ] Started foo"
# for every user service it activates at login (pipewire, hyprland-
# session, xdg-desktop-portal, etc.), and those lines reach /dev/tty1
# via the inheritance chain.
[Manager]
ShowStatus=no
