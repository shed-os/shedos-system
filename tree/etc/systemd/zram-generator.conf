# Compressed swap-in-RAM via zram-generator.
#
# Adds a /dev/zram0 device backed by zstd-compressed RAM. Treated as
# the primary swap device (root fs is btrfs without a disk swap
# partition, so zram is the only swap unless the user adds one).
#
# zram lets the kernel reclaim cold pages by compressing them in place
# instead of paging them out, meaningfully expanding the working set
# on memory-constrained machines (8-16 GB laptops) at the cost of a
# few percent CPU on memory-pressure paths.
#
# Sized at ram/2 (capped at 8 GB) — too small and it doesn't move the
# needle on browser + IDE + Docker working sets, too large and the
# compressed pages start crowding out the cache they'd compress from.
# ram/2 is the systemd / Fedora consensus default.

[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
