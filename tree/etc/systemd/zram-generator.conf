# Compressed swap-in-RAM via zram-generator.
#
# Adds a /dev/zram0 device backed by zstd-compressed RAM. Treated as
# higher-priority swap than any disk-backed swap (which on a typical
# ShedOS install doesn't exist — root is btrfs without a swap partition).
#
# zram lets the kernel reclaim cold pages by compressing them in place
# instead of paging them out, expanding the effective working set by
# roughly 30-40% on typical desktop loads at the cost of a few percent
# CPU on memory-pressure paths.
#
# Sized at ram/2 (capped at 8 GB) — too small and it doesn't move the
# needle on typical browser + IDE + Docker working sets, too large and
# the compressed pages start crowding out the cache they'd compress
# from. ram/2 is the systemd / Fedora consensus default.

[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
