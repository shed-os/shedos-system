# user@<UID>.service inherits stderr from PID1 (typically /dev/console
# = /dev/tty1). User-level services started by user-systemd use
# StandardError=inherit by default, so they inherit stderr from
# user@.service — and writes from any of dozens of user services
# (pipewire, hyprland-session, xdg-desktop-portal, etc.) reach
# tty1's vcs buffer, where fbcon paints them during DRM-master gaps.
#
# Forcing StandardError=journal at user@.service breaks the
# inheritance chain at its root: every child user service that uses
# the default `inherit` now lands in journald instead of /dev/console.
[Service]
StandardOutput=journal
StandardError=journal
