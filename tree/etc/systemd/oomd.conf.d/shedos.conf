# systemd-oomd thresholds for ShedOS desktop.
#
# oomd watches cgroups and kills a process group when memory pressure
# stays high for an extended period; strictly faster than the kernel
# OOM killer (which only fires when allocation actually fails, by which
# point the desktop has been frozen for tens of seconds).
#
# Thresholds tuned conservatively so oomd is a backstop, not a first
# responder. A typical Rust compile + browser tab burst momentarily
# pegs memory pressure but doesn't sustain it; we don't want oomd
# killing kitty mid-build because of a 2-second spike.
#
# DefaultMemoryPressureDurationSec must be ≥ avg10 window (10 s) for
# the average to be meaningful; we go higher to filter transient
# bursts entirely.

[OOM]
DefaultMemoryPressureDurationSec = 20s
SwapUsedLimit = 85%
DefaultMemoryPressureLimit = 60%
