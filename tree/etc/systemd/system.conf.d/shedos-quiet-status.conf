# systemd's default boot/shutdown chatter ("[ OK ] Started foo.service",
# "[ OK ] Stopped bar.service") prints to /dev/console = /dev/tty1, lands
# in vcs1, and is painted by fbcon during DRM-master gaps at compositor
# handoffs. ShowStatus=no silences that output entirely.
#
# The kernel cmdline parameter (systemd.show_status=no) reportedly does
# not fully suppress these lines on shedos's setup; the system.conf.d
# drop-in is the canonical and reliable mechanism per `man systemd-system.conf`.
[Manager]
ShowStatus=no
