# /etc/shedos/system.toml — declarative system state for `shedman apply`.
#
# This file is the default ShedOS ships with. It mirrors the behavior the
# install scriptlet used to apply imperatively, so `shedman apply` is a
# no-op on a freshly-installed system.
#
# Edit freely. Run `shedman apply` afterwards to reconcile. A fully-
# commented template lives at /usr/share/shedos/system.toml.example.
#
# Backed up by pacman (see `backup=` in shedos-system PKGBUILD), so your
# edits become .pacnew on upgrade instead of being overwritten.

schema = 1

# Theme — wallpaper + Catppuccin palette + fonts. Edit and run
# `shedman theme apply` (or `shedman apply`) to push the change
# into hyprland, waybar, walker, GTK, and the greeter.
# Available palettes: see /etc/shedos/themes/palettes/*.toml.
[theme]
wallpaper = "/usr/share/shedos/wallpapers/dusk.png"
palette   = "catppuccin-mocha-blue"
font_ui   = "Inter 11"
font_mono = "JetBrainsMono Nerd Font"

[systemd.system]
enable = [
    "snapper-timeline.timer",
    "snapper-cleanup.timer",
    "systemd-oomd.service",
    "tlp.service",
    "ananicy-cpp.service",
]
disable = []

[systemd.user]
enable = [
    "shedos-update-check.timer",
    "shedos-check-health.timer",
]
disable = []

[snapper.timeline]
enabled = true
hourly  = 5
daily   = 7
weekly  = 0
monthly = 0
yearly  = 0

[snapper.cleanup.number]
limit = 50

# [drop-ins] — intentionally empty in the default.
#
# The /etc drop-ins that shedos-system already ships (sudoers.d/wheel,
# sysctl.d/99-shedos-tuning.conf, NetworkManager/conf.d/*) are managed by pacman
# via backup=() so user edits become .pacnew on upgrade. If `shedman apply`
# took ownership of those same files there'd be a fight between pacman's
# .pacnew merge and apply's reconcile.
#
# Only declare drop-ins here that aren't already pacman-managed. See the
# example template for syntax.

# The [shedos] repo stanza in /etc/pacman.conf. The install scriptlet
# writes an initial fence on first install; ongoing edits flow through
# `shedman apply` so you can add extra repos or tweak SigLevel here.
[pacman.repos.shedos]
server   = "https://repo.shedos.org/stable/$arch"
siglevel = "Required DatabaseRequired"

# PostgreSQL bootstrap — mirrors what the install scriptlet enables.
# Flip either to false to mask the corresponding unit.
[services.postgresql]
auto-init   = true   # shedos-pg-initdb.service
per-user-db = true   # shedos-pg-user-bootstrap.service

# Docker daemon — enabled at install time. Flip to false and run
# `shedman apply` to mask docker.service.
[services.docker]
enable = true

# Realtime audio group. Empty by default — users opt in by adding
# themselves under [[users]].groups (or with `sudo gpasswd -a $USER
# realtime`). The /etc/security/limits.d/30-shedos-realtime.conf file
# grants rtprio + memlock once a user is a member.
[[groups]]
name = "realtime"

# Limine kernel cmdline tokens — user-tunable additions only.
#
# These tokens are applied on first `shedman apply` after install and
# can be removed by deleting any entry below + running apply again.
# Tokens listed here become part of the apply_core protected baseline
# only after they first appear in /boot/limine.conf via this list.
#
# UX-critical tokens (loglevel=3, rd.udev.log_level=3,
# fbcon=nodefer,map:99) are NOT listed here on purpose — they are
# baked into the install-time cmdline by the installer
# (installer/shedos_installer/core/bootloader.py :: _build_cmdline)
# so a fresh install boots without a console flash before any apply
# has run. They become part of the protected baseline on first apply,
# which is the desired property for tokens no end-user would remove.
#
# What each below does:
#   nowatchdog                         disable kernel watchdog timers
#                                      (drops timer interrupts on idle CPUs)
#   split_lock_detect=off              don't trap on cross-cacheline atomics
#                                      (some games / legacy workloads need this)
#   nvme_core.default_ps_max_latency_us=5500
#                                      cap NVMe deepest power state to one
#                                      that wakes within 5.5 ms; some drives
#                                      otherwise stall I/O for 50+ ms
[kernel.cmdline]
append = [
    "nowatchdog",
    "split_lock_detect=off",
    "nvme_core.default_ps_max_latency_us=5500",
]
