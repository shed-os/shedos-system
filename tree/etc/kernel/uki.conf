# ukify config — the signer for every ShedOS Unified Kernel Image (kernel
# transactions build it via the linux-zen preset; the recovery image builds
# it directly). Ships KEYLESS on purpose: a box with no Secure Boot keys
# (BIOS, Secure Boot declined, or an existing install before enrollment)
# builds an UNSIGNED UKI that still boots. `shedman secureboot enroll`
# rewrites this file with the SecureBootPrivateKey/Certificate and a
# [PCRSignature:initrd] section once the per-box keys exist, so kernel
# transactions then produce a signed, PCR-11-signed image. Naming a key
# path that doesn't exist makes ukify abort the build, which is why the
# signing lines are absent until enrollment writes them.
[UKI]
Stub=/usr/lib/systemd/boot/efi/linuxx64.efi.stub
