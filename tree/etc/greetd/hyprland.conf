# Hyprland-as-greeter for ReGreet. Mirrors blur/shadow values from
# /etc/skel/.config/hypr/decoration.conf and the Catppuccin border
# colors from general.conf. Update both when those values change —
# kept in lockstep manually.

monitor = ,preferred,auto,1

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_DATA_DIRS,/usr/local/share:/usr/share
env = LANG,en_US.UTF-8
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11,*
env = GTK_THEME,Catppuccin-Mocha-Standard-Blue-Dark

input {
    kb_layout = us
    kb_options = caps:capslock
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = true
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1e1e2eee)
    }
}

animations {
    enabled = true
    bezier = smoothIn, 0.25, 1, 0.5, 1
    animation = windows, 1, 5, smoothIn
    animation = fade, 1, 5, smoothIn
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    disable_watchdog_warning = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# Render wallpaper, then launch ReGreet. When ReGreet exits — login or
# power action — `hyprctl dispatch exit` ends this Hyprland; greetd then
# execs the chosen user session (or shuts down).
exec-once = hyprpaper -c /etc/greetd/hyprpaper.conf
exec-once = regreet; hyprctl dispatch exit
