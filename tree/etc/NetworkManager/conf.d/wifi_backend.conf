# shedOS: route NetworkManager WiFi through iwd.
#
# Both NetworkManager and iwd are enabled by default, and the waybar network
# icon launches impala (iwd's TUI). Without this file they fight over the
# WiFi device and connections stored via one are invisible to the other —
# which meant WiFi credentials entered during install didn't persist on
# reboot. With iwd as NM's backend, both surface the same profiles from
# /var/lib/iwd/.
[device]
wifi.backend=iwd
