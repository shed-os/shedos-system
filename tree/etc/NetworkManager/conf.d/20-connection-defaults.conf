# shedOS: persist wifi passwords across full shutdown cycles.
#
# Without this, NetworkManager stores wifi secrets as `agent-owned`
# (psk-flags=1), which means the PSK lives only in the user's login
# keyring. On a cold boot the keyring is locked and NM can't read the
# password, so auto-connect fails and the user is prompted again.
#
# Setting psk-flags=0 stores secrets in /etc/NetworkManager/system-connections/
# as system-owned files, so auto-connect works from the very first second
# of boot — before the user even logs in.
#
# Also force autoconnect for every new connection so joining a wifi once
# is enough.

[connection]
wifi-sec.psk-flags = 0
802-1x.password-flags = 0
802-1x.private-key-password-flags = 0
connection.autoconnect = true
