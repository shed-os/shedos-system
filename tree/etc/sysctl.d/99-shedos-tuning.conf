# ShedOS system-wide sysctl defaults.
#
# Numbered 99- so it overrides anything in /usr/lib/sysctl.d/ shipped by
# upstream packages. Targeted at a developer desktop: SSD/NVMe-heavy,
# 16-64 GB RAM, mixed workload (browser tabs, Docker, language runtimes,
# heavy compiles). The HDD-friendly knobs (dirty_*_ratio, vfs_cache_pressure)
# are also fine on SSDs — they just don't kick in.
#
# Tunable freely by users via /etc/sysctl.d/ overrides numbered higher than
# 99 (e.g. /etc/sysctl.d/99-myname.conf wins because alphabetical order).

# Memory: don't swap aggressively. Modern machines with NVMe + 16 GB+ RAM
# have no business swapping at the upstream default of 60.
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# Writeback ceilings — HDD-friendly, harmless on SSD. The kernel default
# (10% / 20% of RAM) means a 32 GB-RAM box can queue 6.4 GB of dirty pages
# before forcing writeback, producing 30-second stalls when that finally
# flushes to a spinning disk. Capping at 5% / 10% trades sustained-write
# throughput for predictable latency. SSDs don't notice.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Full SysRq surface for developers. Recovery from a wedged Wayland session
# is `Alt+SysRq+R E I S U B`; without sysrq=1 those keys do nothing.
kernel.sysrq = 1

# Networking: BBR + CAKE. BBR's loss-and-RTT-driven model handles flaky
# wifi (cafes, coworking spaces, hotel networks) better than cubic's
# AIMD. CAKE's per-host fairness prevents one `docker pull` from
# starving every browser tab on the same connection.
net.core.default_qdisc = cake
net.ipv4.tcp_congestion_control = bbr

# Don't gate every memory-mapped operation behind split-lock detection;
# some legacy workloads (and a handful of Steam games) trigger it constantly
# and pay 10ms+ per false positive. The kernel default is "warn" since 5.7;
# we set =0 to skip the warning entirely.
kernel.split_lock_mitigate = 0

# Intel iGPU performance counters readable by non-root. Enables `perf` and
# `intel_gpu_top` without sudo. Harmless on AMD/NVIDIA — the sysctl just
# doesn't exist there, and `sysctl -p` skips unknown keys with a warning.
dev.i915.perf_stream_paranoid = 0
