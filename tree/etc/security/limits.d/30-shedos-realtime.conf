# Realtime priority + memlock for the @realtime group.
#
# Members of `realtime` can request RT scheduling (rtprio up to 95) and
# lock unlimited memory pages. Required by Pipewire's realtime audio
# path, JACK, and any low-latency audio/video tooling.
#
# Membership is opt-in. No user is added to `realtime` by default —
# add yourself via `sudo gpasswd -a $USER realtime` (or declaratively
# in /etc/shedos/system.toml under [[users]]) and re-login.
#
# rtprio capped at 95 (not 99) so a runaway RT process can never
# preempt the kernel's own RT-priority-99 threads (migration, watchdogs).

@realtime   -   rtprio      95
@realtime   -   memlock     unlimited
@realtime   -   nice        -19
