# Default ShedOS snapper config for the root subvolume (`@`).
#
# Shipped by shedos-system at /usr/share/shedos/snapper/root.conf; installed
# to /etc/snapper/configs/root by the post_install scriptlet on first install
# only. Subsequent upgrades leave existing /etc/snapper/configs/root alone so
# user tuning sticks.
#
# The ShedOS btrfs layout mounts `@snapshots` at `/.snapshots`, so snapper's
# usual "create the .snapshots subvolume for me" dance is skipped — the
# directory already exists at install time. We just point snapper at it.

# subvolume to snapshot
SUBVOLUME="/"

# filesystem type
FSTYPE="btrfs"

# btrfs qgroup for snapper — leave empty unless quotas are explicitly enabled.
QGROUP=""

# fraction of the subvolume size snapper treats as "space to work with"
SPACE_LIMIT="0.5"

# fraction of the subvolume size at which free-space cleanup kicks in
FREE_LIMIT="0.2"

# users and groups allowed to work with this config. wheel is ShedOS's admin
# group (sudoers.d/wheel grants passwordless sudo to wheel), so any user in
# wheel can `snapper list` and `shedos-update --rollback` without extra perms.
ALLOW_USERS=""
ALLOW_GROUPS="wheel"

# propagate ALLOW_USERS / ALLOW_GROUPS into .snapshots via POSIX ACLs so
# snapshot reads work without sudo. Cheap, useful.
SYNC_ACL="yes"

# compare pre- and post-snapshots in the background so shedos-update's
# synchronous flow doesn't block on diff computation.
BACKGROUND_COMPARISON="yes"

# keep pre/post pairs when they're semantically empty (no package changes,
# no file changes) — set to "yes" to reclaim space automatically.
EMPTY_PRE_POST_CLEANUP="yes"
EMPTY_PRE_POST_MIN_AGE="1800"

# number cleanup: prune "number"-type snapshots (the pre/post pairs from
# shedos-update + any manual snapshots) once we're past the limits.
NUMBER_CLEANUP="yes"
NUMBER_MIN_AGE="1800"
NUMBER_LIMIT="50"
NUMBER_LIMIT_IMPORTANT="10"

# timeline: hourly/daily background snapshots.
# Conservative defaults — users who want tighter retention can edit this
# file; it's not pacman-managed after first install.
TIMELINE_CREATE="yes"
TIMELINE_CLEANUP="yes"
TIMELINE_MIN_AGE="1800"
TIMELINE_LIMIT_HOURLY="5"
TIMELINE_LIMIT_DAILY="7"
TIMELINE_LIMIT_WEEKLY="0"
TIMELINE_LIMIT_MONTHLY="0"
TIMELINE_LIMIT_YEARLY="0"
