# Greeter: cage runs shedos-greeter on tty1.
#
# cage is a minimal Wayland kiosk compositor. shedos-greeter draws
# its own wallpaper + clock + password input via wlr-layer-shell and
# authenticates against greetd's IPC socket. PAM runs server-side as
# root, before any user environment exists.
#
# Live-ISO installs append [initial_session] in customize_airootfs.sh
# to autologin the live `shedos` user; shedos_finalize strips that on
# install. /etc/greetd/config.toml is owned by upstream `greetd`, so
# this template lives in /usr/share/shedos/greetd/ and the install
# scriptlet copies it to /etc/greetd/ on every install/upgrade.

[terminal]
vt = "next"

[default_session]
# Wrap cage in `env HOME=...` because pam_systemd may not set HOME for
# the kiosk session before cage's EGL pipeline tries to write Mesa's
# shader cache to $HOME/.cache (`Failed to create //.cache for shader
# cache (Permission denied)` is the symptom of an empty HOME).
#
# Wrap the whole thing in `systemd-cat -t cage-greeter --` so cage's
# wlroots backend-init logs ([libseat], [backend/drm], [render/egl],
# [render/gles2]) are captured by journald instead of writing to the
# session TTY's vcs buffer. Without this, fbcon paints those logs on
# the framebuffer during DRM-master gaps at compositor handoffs
# (Plymouth→cage, cage→Hyprland, Hyprland→Plymouth-shutdown). Logs
# remain fully recoverable via `journalctl -t cage-greeter`.
command = "env HOME=/var/lib/greetd systemd-cat -t cage-greeter -- cage -s -- /usr/bin/shedos-greeter"
user = "greeter"
