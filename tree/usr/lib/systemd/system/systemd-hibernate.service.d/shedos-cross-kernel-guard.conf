# Cross-kernel hibernation guard. ExecCondition exit 1 cleanly SKIPS the
# sleep (without marking the unit failed) when the running kernel isn't
# the default boot kernel, so a resume image can't be read back by a
# different kernel during the shedos-kernel→linux-zen migration. Covers
# every hibernate path (power UIs, shedman power, a manual `systemctl
# hibernate`). See /usr/lib/shedos/hibernate-guard-check.
[Service]
ExecCondition=/usr/lib/shedos/hibernate-guard-check
