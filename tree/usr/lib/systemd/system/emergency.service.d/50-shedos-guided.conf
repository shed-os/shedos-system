# Override the locked-root sulogin dead-end with the guided recovery
# entrypoint. Empty ExecStart= resets before re-setting it; the leading -
# keeps a non-zero exit from failing the unit. SYSTEMD_SULOGIN_FORCE makes
# sulogin passwordless if the entrypoint ever falls through to it.
[Service]
Environment=SYSTEMD_SULOGIN_FORCE=1
ExecStart=
ExecStart=-/usr/lib/shedos/emergency-recovery emergency
